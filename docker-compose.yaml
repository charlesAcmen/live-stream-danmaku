#Yet Another Markup Language lol
version: '3.8'

services:
  # 1. Redis: broadcast among servers
  redis:
    image: redis:latest
    container_name: danmaku_redis
    ports:
      - "6379:6379"
    restart: always

  # 2. MySQL: consistent storage for danmaku
  mysql:
    image: mysql:8.0
    container_name: danmaku_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root  
      MYSQL_DATABASE: danmaku_db  
    #Authentication plugin 'caching_sha2_password' cannot be loaded
    command: --default-authentication-plugin=mysql_native_password
    restart: always

  # 3. Zookeeper
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: danmaku_zookeeper
    ports:
      - "2181:2181"

  # 4. Kafka
  kafka:
    image: wurstmeister/kafka
    container_name: danmaku_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper